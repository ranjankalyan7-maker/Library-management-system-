
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Books</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .table-container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f6fc;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .issued {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 View All Books</h1>
    <p>Library Management System</p>
</header>

<main>
    <h2>Available Library Records</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Title</th>
                    <th>Author Name</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="book-list">
                <tr>
                    <td colspan="4">Loading books...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="index.html">← Back to Home</a>
</main>

<footer>
    <p>Library Management System | Mini Project</p>
</footer>

<script>
fetch("/books")
    .then(response => {
        if (!response.ok) {
            throw new Error("Unable to load books");
        }
        return response.text();
    })
    .then(data => {
        document.getElementById("book-list").innerHTML = data;

        document.querySelectorAll("#book-list tr").forEach(row => {
            const statusCell = row.cells[3];

            if (statusCell) {
                if (statusCell.textContent.trim() === "Available") {
                    statusCell.classList.add("available");
                } else if (statusCell.textContent.trim() === "Issued") {
                    statusCell.classList.add("issued");
                }
            }
        });
    })
    .catch(error => {
        document.getElementById("book-list").innerHTML =
            "<tr><td colspan='4'>Unable to load books.</td></tr>";
    });
</script>

</body>
</html>
