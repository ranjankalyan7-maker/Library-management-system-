
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book - Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Library Management System</h1>
        <p>Issue a Book</p>
    </header>

    <main class="container">
        <h2>Issue Book</h2>

        <form id="issue-form">
            <p>Enter Book ID</p>
            <input type="number" id="book-id"
                   placeholder="Enter Book ID" required>
            <br><br>
            <button type="submit">Issue Book</button>
        </form>

        <div id="result"></div>

        <br>
        <a href="index.html">Back to Home</a>
    </main>

    <footer>
        <p>Library Management System</p>
    </footer>

    <script>
        document.getElementById("issue-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const id = document.getElementById("book-id").value;

                fetch("/issue-book?id=" + encodeURIComponent(id))
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("result").innerHTML = data;
                    })
                    .catch(() => {
                        document.getElementById("result").textContent =
                            "Unable to issue book.";
                    });
            });
    </script>

</body>
</html>
